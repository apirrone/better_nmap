name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            name: linux-x86_64
            os: ubuntu-latest
            cross: true
          - target: aarch64-unknown-linux-musl
            name: linux-aarch64
            os: ubuntu-latest
            cross: true
          - target: armv7-unknown-linux-musleabihf
            name: linux-armv7
            os: ubuntu-latest
            cross: true
          # Darwin needs Apple's SDK, so it builds on a macOS runner with
          # plain cargo; macos-latest is arm64 and ships both SDKs, so the
          # x86_64 slice cross-compiles there without extra tooling.
          - target: aarch64-apple-darwin
            name: macos-aarch64
            os: macos-latest
            cross: false
          - target: x86_64-apple-darwin
            name: macos-x86_64
            os: macos-latest
            cross: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools
        if: matrix.cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build release binary
        run: ${{ matrix.cross && 'cross' || 'cargo' }} build --release --target ${{ matrix.target }}

      - name: Prepare binary
        run: |
          mkdir -p release
          cp target/${{ matrix.target }}/release/bnmap release/bnmap-${{ matrix.name }}
          chmod +x release/bnmap-${{ matrix.name }}

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: bnmap-${{ matrix.name }}
          path: release/bnmap-${{ matrix.name }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release
          find artifacts -type f -name 'bnmap-*' -exec cp {} release/ \;
          cd release
          for file in bnmap-*; do
            tar czf "${file}.tar.gz" "$file"
          done
          sha256sum *.tar.gz > SHA256SUMS

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.tar.gz
            release/SHA256SUMS
          body: |
            ## Installation

            ```bash
            curl -sSL https://raw.githubusercontent.com/apirrone/better_nmap/main/install.sh | sh
            ```

            Or download the binary for your platform below.

            - `linux-x86_64`: Intel/AMD 64-bit
            - `linux-aarch64`: ARM64 (Raspberry Pi 4/5 64-bit, Jetson, ...)
            - `linux-armv7`: ARMv7 (Raspberry Pi 2/3/4 32-bit)
            - `macos-aarch64`: Apple silicon (M1 and later)
            - `macos-x86_64`: Intel Macs

            Verify with `sha256sum -c SHA256SUMS`.

            macOS binaries are unsigned: on first run, clear the quarantine
            flag with `xattr -d com.apple.quarantine /usr/local/bin/bnmap`.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
